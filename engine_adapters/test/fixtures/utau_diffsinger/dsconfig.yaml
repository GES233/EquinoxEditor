phonemes: phonemes.txt
acoustic: acoustic.onnx
vocoder: nsf_hifigan
sample_rate: 44100
hop_size: 512
dur: dsdur/dur.onnx
linguistic: dsdur/linguistic.onnx
pitch: dspitch/pitch.onnx
variance: dsvariance/variance.onnx
predict_dur: true
predict_energy: true
predict_breathiness: true
predict_tension: true
useEnergyEmbed: true
useBreathinessEmbed: true
speakers:
  - speaker_a.spk
  - speaker_b.spk
augmentationArgs:
  randomPitchShifting:
    range: [-5.0, 5.0]
